name: Build and publish the Windows app

# Every push to main builds the portable .exe and attaches it to the release for
# the version in package.json. /download and the app's updater read that release,
# so a push is all it takes to publish a build. Bump "version" in package.json so
# installed apps see it as newer instead of the same one rebuilt.

on:
  push:
    branches: [main]
    paths:
      - 'electron/**'
      - 'src/**'
      - 'renderer/**'
      - 'assets/**'
      - 'build/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Check
        run: npm run check

      - name: Build the portable app
        run: npm run dist

      - name: Version and checksum
        id: meta
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SHA=$(sha256sum dist/Aegis-Control.exe | cut -d' ' -f1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          ls -l dist/Aegis-Control.exe

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
          SHA: ${{ steps.meta.outputs.sha }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          NOTES="Built automatically from ${GITHUB_SHA:0:7}.

          SHA256: $SHA"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes "$NOTES" --title "Aegis Control v$VERSION"
            gh release upload "$TAG" dist/Aegis-Control.exe --clobber
          else
            gh release create "$TAG" dist/Aegis-Control.exe \
              --title "Aegis Control v$VERSION" --notes "$NOTES"
          fi
          echo "Published $TAG with sha256 $SHA"
